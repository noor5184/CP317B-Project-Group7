<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title }} | REgistro</title>
</head>
<body>

    {% if g.user["role"] == "admin" %}
        <p>
            <a href="{{ url_for('admin_courses.course_form') }}">
                Add a course
            </a>
        </p>

        <p>
            <a href="{{ url_for('admin_sections.section_form') }}">
                Add a section
            </a>
        </p>
    {% endif %}

    <form method="post" action="{{ url_for('auth.logout') }}">
        <input type="hidden" name="csrf_token"
                value="{{ csrf_token() }}">
         <button type="submit">Log out</button>
    </form>

    <main>
        <h1>REgistro</h1>
        <h2>{{ title }}</h2>

        <p>
            Signed in as
            <strong>{{ g.user["username"] }}</strong>.
        </p>

        {% if student %}
            <p>Name: {{ student["full_name"] }}</p>
            <p>Student number: {{ student["student_number"] }}</p>
        {% endif %}
    </main>
</body>
</html>
